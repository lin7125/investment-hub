name: 更新行情數據

on:
  workflow_dispatch:        # 手機/網頁一鍵手動更新
  schedule:                 # 註：GitHub 免費版排程會被延遲甚至略過，高頻 cron 掉得更兇；
                            # 實測 */10 幾乎不執行，故降頻求穩。要即時請用網頁「⟳ 更新」手動觸發。
    - cron: '5,35 1-5 * * 1-5'   # 台股盤中（台北 09:05–13:35）每 30 分
    - cron: '31 6 * * 1-5'       # 台股收盤後完整快照 14:31（台北）
    - cron: '5,35 13-20 * * 1-5' # 美股盤中（台北 21:05–04:35）每 30 分
    - cron: '35 21 * * 1-5'      # 美股收盤後快照 05:35（台北）

permissions:
  contents: write

concurrency:
  group: refresh-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install --quiet --upgrade -r requirements.txt
      - run: python scripts/refresh_data.py
      - run: |
          git config user.name "market-refresh-bot"
          git config user.email "lin7125@gmail.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "盤中行情更新 $(TZ=Asia/Taipei date +'%F %H:%M')"
          git push
