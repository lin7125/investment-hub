name: 更新行情數據

on:
  workflow_dispatch:        # 手機/網頁一鍵手動更新
  schedule:                 # 這裡只留「單次快照」與備援；盤中每 10 分鐘的密集更新
                            # 已改由 market-loop.yml 的長跑迴圈負責（cron 只需成功觸發 1 次）。
    - cron: '20 1-5 * * 1-5'     # 台股盤中備援（長跑迴圈萬一沒被觸發時的保險）
    - cron: '31 6 * * 1-5'       # 台股收盤後完整快照 14:31（台北）
    - cron: '20 13-20 * * 1-5'   # 美股盤中備援
    - cron: '35 21 * * 1-5'      # 美股收盤後快照 05:35（台北）

permissions:
  contents: write

concurrency:
  group: refresh-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install --quiet --upgrade -r requirements.txt
      - run: python scripts/refresh_data.py
      - run: |
          git config user.name "market-refresh-bot"
          git config user.email "lin7125@gmail.com"
          git add docs/data.json
          if git diff --cached --quiet; then echo "資料無變化"; exit 0; fi
          git commit -q -m "盤中行情更新 $(TZ=Asia/Taipei date +'%F %H:%M')"
          # 與長跑迴圈可能同時推送，衝突時重整後重試
          for i in 1 2 3 4 5; do
            if git push -q 2>/dev/null; then echo "✅ 已推送"; exit 0; fi
            echo "push 被拒（第 $i 次）→ 重整重試"
            git fetch -q origin main
            if ! git rebase -X theirs origin/main >/dev/null 2>&1; then
              git rebase --abort >/dev/null 2>&1 || true
              git reset --hard -q origin/main
              python scripts/refresh_data.py || true
              git add docs/data.json
              git diff --cached --quiet || git commit -q -m "盤中行情更新(重整後) $(TZ=Asia/Taipei date +'%F %H:%M')"
            fi
            sleep 5
          done
          echo "⚠️ 推送失敗"; exit 1
