name: 盤中連續更新（長跑迴圈）

# 為什麼要這個 workflow：
# GitHub 免費版的排程（cron）會被延遲甚至直接丟棄，實測 */10 幾乎不執行，
# data.json 實際更新間隔淪為 2-6 小時。解法不是「排更密」，而是「少排幾次、每次跑久一點」：
# 每個交易時段只需要 cron 成功觸發 1 次，之後由這個 job 自己在裡面每 10 分鐘抓一次，
# 一路跑到收盤。單次 job 上限 6 小時，本 repo 為公開 repo，Actions 分鐘數免費不計量。

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: '這次要連續跑幾分鐘'
        default: '60'
      interval:
        description: '每幾秒抓一次'
        default: '600'
  schedule:
    - cron: '55 0 * * 1-5'   # 台北 08:55 → 台股全場（280 分，至 13:35）
    - cron: '25 13 * * 1-5'  # 台北 21:25 → 美股前半場（195 分，至 00:40）
    - cron: '45 16 * * 1-5'  # 台北 00:45 → 美股後半場（205 分，至 04:10）

permissions:
  contents: write

concurrency:
  group: market-loop
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install --quiet --upgrade -r requirements.txt
      - name: 連續抓價迴圈
        env:
          SCH: ${{ github.event.schedule }}
          IN_MIN: ${{ github.event.inputs.minutes }}
          IN_INT: ${{ github.event.inputs.interval }}
        run: |
          set -u
          if   [ "$SCH" = "55 0 * * 1-5"  ]; then MIN=280
          elif [ "$SCH" = "25 13 * * 1-5" ]; then MIN=195
          elif [ "$SCH" = "45 16 * * 1-5" ]; then MIN=205
          else MIN="${IN_MIN:-60}"
          fi
          INT="${IN_INT:-600}"
          echo "本次連續執行 ${MIN} 分鐘，每 ${INT} 秒抓一次（觸發來源：${SCH:-手動}）"

          git config user.name  "market-refresh-bot"
          git config user.email "lin7125@gmail.com"

          END=$(( $(date +%s) + MIN * 60 ))
          N=0
          while [ "$(date +%s)" -lt "$END" ]; do
            N=$((N+1))
            echo "── 第 ${N} 輪 $(TZ=Asia/Taipei date +'%F %H:%M:%S') ──"
            python scripts/refresh_data.py || echo "⚠️ 本輪抓價失敗，保留舊資料續跑"

            git add docs/data.json
            if git diff --cached --quiet; then
              echo "資料無變化，不commit"
            else
              git commit -q -m "盤中行情更新 $(TZ=Asia/Taipei date +'%F %H:%M')"
              PUSHED=0
              for i in 1 2 3 4 5; do
                if git push -q 2>/dev/null; then PUSHED=1; break; fi
                echo "push 被拒（第 ${i} 次），與遠端重整後重試"
                git fetch -q origin main
                if ! git rebase -X theirs origin/main >/dev/null 2>&1; then
                  git rebase --abort >/dev/null 2>&1 || true
                  git reset --hard -q origin/main
                  python scripts/refresh_data.py || true
                  git add docs/data.json
                  git diff --cached --quiet || git commit -q -m "盤中行情更新(重整後) $(TZ=Asia/Taipei date +'%F %H:%M')"
                fi
                sleep 5
              done
              [ "$PUSHED" = "1" ] && echo "✅ 已推送" || echo "⚠️ 連續 5 次推送失敗，下一輪再試"
            fi

            NOW=$(date +%s)
            LEFT=$(( END - NOW ))
            [ "$LEFT" -le 0 ] && break
            [ "$LEFT" -lt "$INT" ] && break
            sleep "$INT"
          done
          echo "迴圈結束，共執行 ${N} 輪"
